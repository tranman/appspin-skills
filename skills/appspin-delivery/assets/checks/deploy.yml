# An App's deploy, with the account token in the CLOUDFLARE_API_TOKEN secret. On adopt's branch it prints
# the account's workers.dev subdomain, for delivery.json's origins. On each merge it builds and deploys
# staging, and builds and uploads production's candidate, whose deploy check promote requires; each job
# builds with its GitHub environment's variables and secrets.
name: deploy

on:
  push:
    branches: [main, adopt]

# One deploy at a time, so staging never goes back to an older merge.
concurrency:
  group: deploy-${{ github.ref }}

permissions:
  contents: read

jobs:
  subdomain:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .agents/skills/appspin-delivery/scripts/deploy.sh subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Staging first; a failure there cancels production's upload, the deploy (production) check promote requires.
  deploy:
    if: github.ref == 'refs/heads/main'
    strategy:
      max-parallel: 1
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - run: bash .agents/skills/appspin-delivery/scripts/deploy.sh env >> "$GITHUB_ENV"
        env:
          VARS: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
      - run: bash .agents/skills/appspin-delivery/scripts/deploy.sh ${{ matrix.environment }} "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
