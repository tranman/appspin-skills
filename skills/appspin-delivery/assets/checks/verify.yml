# The same command the push hook runs, on pull requests and on every merge to main,
# whose result promote reads. It sets up Node only where the project uses it,
# and shellcheck and gitleaks always, since verify's starting steps use them.
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Per commit on main: promote needs a verify on every merge commit.
concurrency:
  group: verify-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the secrets step scans every commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node where the project has it: its .nvmrc, or the runner's Node.
      - uses: actions/setup-node@v7
        if: hashFiles('.nvmrc', 'package.json') != ''
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      # The same version as a developer's machine: the image's shellcheck is older.
      - name: Install shellcheck
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      # The secrets step's scanner, pinned and checked like shellcheck.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      # The project's verify, through its task runner: make when delivery.json names none.
      - run: $(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).roles?.runner ?? "make"' .config/appspin/delivery.json 2>/dev/null || echo make) verify
