  <text class="label" x="401" y="75" text-anchor="middle">sends agents to</text>
  <path class="flow" d="M320 186 H458" marker-end="url(#a)"/>
  <text class="label" x="389" y="179" text-anchor="middle">adopt writes</text>
  <path class="flow" d="M320 758 H440 V701 H458" marker-end="url(#a)"/>
  <text class="label" x="380" y="751" text-anchor="middle">installs</text>
  <path class="flow gate" d="M480 247 H440 V247 H322" marker-end="url(#a)"/>
