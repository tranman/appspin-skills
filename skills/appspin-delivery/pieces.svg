  <text class="title" x="472" y="40" text-anchor="start">YOUR REPOSITORY</text>
  <rect class="step" x="480" y="56" width="340" height="52" rx="6"/>
  <text class="name" x="650" y="78" text-anchor="middle">AGENTS.md</text>
  <text class="tool" x="650" y="95" text-anchor="middle">the package's section · your lines</text>
  <rect class="step" x="480" y="155" width="340" height="104" rx="6"/>
  <text class="name" x="650" y="175" text-anchor="middle">task runner</text>
  <text class="tool" x="631" y="195" text-anchor="end">verify</text>
  <text class="tool" x="641" y="195">verify.steps</text>
  <text class="tool" x="631" y="211" text-anchor="end">smoke</text>
  <text class="tool" x="641" y="211">smoke.steps</text>
