  <text class="tool" x="641" y="243">promote.mjs</text>
  <rect class="step" x="480" y="306" width="340" height="52" rx="6"/>
  <text class="name" x="650" y="328" text-anchor="middle">CI workflows</text>
  <text class="tool" x="650" y="345" text-anchor="middle">verify · smoke · e2e</text>
  <rect class="step" x="480" y="405" width="340" height="60" rx="6"/>
  <text class="stereo" x="650" y="422" text-anchor="middle">«package»</text>
  <text class="name" x="650" y="439" text-anchor="middle">pre-push</text>
  <text class="tool" x="650" y="455" text-anchor="middle">.githooks/</text>
  <rect class="step" x="480" y="512" width="340" height="60" rx="6"/>
  <text class="stereo" x="650" y="529" text-anchor="middle">«package»</text>
  <text class="name" x="650" y="546" text-anchor="middle">pull_request_template.md</text>
  <text class="tool" x="650" y="562" text-anchor="middle">.github/</text>
  <rect class="step" x="910" y="56" width="334" height="728" rx="6"/>
  <text class="name" x="1077" y="80" text-anchor="middle">delivery.json</text>
  <text class="tool" x="1077" y="97" text-anchor="middle">each role and the tool that fills it</text>
  <text class="group" x="932" y="126" text-anchor="start">REACHED THROUGH AN ADAPTER</text>
  <rect class="step" x="932" y="132" width="296" height="30" rx="6"/>
  <text class="name" x="946" y="152" text-anchor="start">repo</text>
  <text class="tool" x="1214" y="152" text-anchor="end">GitHub</text>
  <rect class="step" x="932" y="180" width="296" height="30" rx="6"/>
  <text class="name" x="946" y="200" text-anchor="start">deploy</text>
  <text class="tool" x="1214" y="200" text-anchor="end">Cloudflare, for an App</text>
  <text class="group" x="932" y="344" text-anchor="start">RUN WHAT YOUR REPOSITORY HOLDS</text>
  <rect class="step" x="932" y="350" width="296" height="30" rx="6"/>
  <text class="name" x="946" y="370" text-anchor="start">runner</text>
  <text class="tool" x="1214" y="370" text-anchor="end">make · just · npm</text>
  <rect class="step" x="932" y="398" width="296" height="30" rx="6"/>
  <text class="name" x="946" y="418" text-anchor="start">ci</text>
  <text class="tool" x="1214" y="418" text-anchor="end">GitHub Actions</text>
  <text class="group" x="932" y="514" text-anchor="start">WHERE THE AGENT WORKS</text>
  <rect class="step" x="932" y="520" width="296" height="30" rx="6"/>
  <text class="name" x="946" y="540" text-anchor="start">harness</text>
  <text class="tool" x="1214" y="540" text-anchor="end">Claude Code</text>
