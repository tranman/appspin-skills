<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    <title>The pieces of the appspin delivery package</title>
  <desc>Left, the package: the standard and its how-to and reference, four skills, and the installer; the delivery skill shows its steps, its scripts, its adapters, its templates, in three groups: templates for a change, agents' instructions, and the checks with what runs them. Right, your repository: AGENTS.md, the task runner and what each of its commands runs, the CI workflows, and the files tagged «package»: the push hook and the pull request template; and delivery.json, which holds the nine roles and the tool that fills each, grouped by how each is reached: repo and deploy through an adapter; runner and ci by running what the repository holds; harness, coding, review, and backlog where the agent works; and the knowledge base outside the code. The installer installs the package into the repository, adopt writes it, AGENTS.md sends agents to the standard, the task runner calls the delivery skill's scripts and reaches the two adapter roles, and the task runner and the CI workflows run on their roles' tools.</desc>
  <style>
    .phase { fill: #f6f8fa; stroke: #d0d7de; }
    .step { fill: #ffffff; stroke: #57606a; }
    .name { font-weight: 600; fill: #1f2328; }
    .tool { fill: #57606a; font-size: 12px; }
    .title { font-weight: 700; fill: #57606a; font-size: 12px; letter-spacing: .04em; }
    .flow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .gate { stroke-dasharray: 4 3; }
    .label { fill: #57606a; font-size: 12px; }
    .head { fill: #57606a; }
    .stereo { fill: #57606a; font-size: 12px; font-style: italic; }
    .group { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .phase { fill: #161b22; stroke: #30363d; }
      .step { fill: #0d1117; stroke: #8b949e; }
      .name { fill: #e6edf3; }
      .tool, .title, .label, .stereo, .group { fill: #8b949e; }
      .flow { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- the package -->
  <rect class="phase" x="20" y="20" width="320" height="780" rx="6"/>
  <text class="title" x="32" y="40" text-anchor="start">THE PACKAGE</text>
  <rect class="step" x="40" y="56" width="280" height="52" rx="6"/>
  <text class="name" x="180" y="78" text-anchor="middle">standard.md</text>
  <text class="tool" x="180" y="95" text-anchor="middle">how-to.md · reference.md</text>
  <rect class="step" x="40" y="128" width="280" height="294" rx="6"/>
  <text class="stereo" x="180" y="146" text-anchor="middle">«skill»</text>
  <text class="name" x="180" y="163" text-anchor="middle">appspin-delivery</text>
  <rect class="phase" x="52" y="178" width="256" height="38" rx="6"/>
  <text class="group" x="180" y="193" text-anchor="middle">STEPS</text>
  <text class="tool" x="180" y="209" text-anchor="middle">adopt · promote · draft an item</text>
  <rect class="phase" x="52" y="228" width="256" height="38" rx="6"/>
  <text class="group" x="180" y="243" text-anchor="middle">SCRIPTS</text>
  <text class="tool" x="180" y="259" text-anchor="middle">verify.sh · smoke.sh · promote.mjs · …</text>
  <rect class="phase" x="52" y="278" width="256" height="54" rx="6"/>
  <text class="group" x="180" y="293" text-anchor="middle">ADAPTERS</text>
  <text class="tool" x="180" y="309" text-anchor="middle">github</text>
  <text class="tool" x="180" y="324" text-anchor="middle">cloudflare</text>
  <rect class="phase" x="52" y="344" width="256" height="70" rx="6"/>
  <text class="group" x="180" y="359" text-anchor="middle">TEMPLATES</text>
  <text class="tool" x="180" y="375" text-anchor="middle">templates · agents</text>
  <text class="tool" x="180" y="390" text-anchor="middle">checks: verify.steps · Makefile</text>
  <text class="tool" x="180" y="405" text-anchor="middle">verify.yml · staging.yml · pre-push</text>
  <rect class="step" x="40" y="492" width="280" height="60" rx="6"/>
  <text class="stereo" x="180" y="509" text-anchor="middle">«skill»</text>
  <text class="name" x="180" y="526" text-anchor="middle">appspin-review</text>
  <text class="tool" x="180" y="542" text-anchor="middle">reviews a branch</text>
  <rect class="step" x="40" y="572" width="280" height="60" rx="6"/>
  <text class="stereo" x="180" y="589" text-anchor="middle">«skill»</text>
  <text class="name" x="180" y="606" text-anchor="middle">appspin-write</text>
  <text class="tool" x="180" y="622" text-anchor="middle">writes what people read</text>
  <rect class="step" x="40" y="652" width="280" height="60" rx="6"/>
  <text class="stereo" x="180" y="669" text-anchor="middle">«skill»</text>
  <text class="name" x="180" y="686" text-anchor="middle">appspin-explore</text>
  <text class="tool" x="180" y="702" text-anchor="middle">explores a running copy</text>
  <rect class="step" x="40" y="732" width="280" height="52" rx="6"/>
  <text class="name" x="180" y="754" text-anchor="middle">appspin-skills.sh</text>
  <text class="tool" x="180" y="771" text-anchor="middle">bin/</text>

  <!-- your repository: its files on the left, delivery.json's roles on the right -->
